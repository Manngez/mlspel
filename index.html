<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020714">
  <title>MLspel — välj din spelvärld</title>
  <meta name="description" content="Välj Beatline eller Orten. Två spel, en portal.">
  <link rel="preload" href="assets/mlspel-start.jpg" as="image">
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#020714;overflow:hidden}
    body{display:grid;place-items:center}
    .poster{position:relative;width:min(100vw,56.25svh);height:min(177.777vw,100svh);aspect-ratio:9/16}
    .poster img{display:block;width:100%;height:100%;object-fit:contain}
    .hotspot{position:absolute;left:9.5%;width:81%;border-radius:12vw;text-indent:-9999px;overflow:hidden;outline:none;-webkit-tap-highlight-color:transparent}
    .hotspot:focus-visible{box-shadow:0 0 0 4px #fff,0 0 30px #fff}
    .beatline{top:64.2%;height:13.2%}
    .orten{top:79.1%;height:13.3%}
  </style>
</head>
<body>
  <main class="poster">
    <img src="assets/mlspel-start.jpg" alt="MLspel. Välj din spelvärld. Två spel, en portal. Beatline: placera låtarna rätt i tiden. Orten: hitta orterna och dra linjerna.">
    <a class="hotspot beatline" href="https://manngez.github.io/Beatline/" aria-label="Öppna Beatline">Beatline</a>
    <a class="hotspot orten" href="https://manngez.github.io/orten/" aria-label="Öppna Orten">Orten</a>
  </main>
</body>
</html>
