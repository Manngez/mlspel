<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030817">
  <title>MLspel — välj din spelvärld</title>
  <meta name="description" content="Beatline och Orten — två spelvärldar, samlade på ett ställe.">
  <link rel="preload" href="assets/mlspel-portal.png" as="image">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap');
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#030817;color:#fff;font-family:Manrope,Arial,sans-serif}body{overflow:hidden}.portal{position:relative;width:100%;height:100svh;min-height:600px;overflow:hidden;isolation:isolate}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;z-index:-3}.shade{position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(1,5,18,.8) 0%,rgba(1,5,18,.25) 25%,transparent 49%,rgba(1,5,18,.2) 100%)}.top{position:absolute;top:max(24px,env(safe-area-inset-top));left:50%;width:min(90%,680px);transform:translateX(-50%);text-align:center;text-shadow:0 3px 25px #000}.brand{display:inline-flex;align-items:center;gap:9px;margin-bottom:13px;color:#c9ff59;font-size:.68rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.brand:before{content:"";width:8px;height:8px;border-radius:50%;background:#c9ff59;box-shadow:0 0 18px #c9ff59}h1{margin:0;font-size:clamp(2.35rem,8vw,5.6rem);line-height:.9;letter-spacing:-.065em}h1 span{color:#c9ff59}.intro{max-width:470px;margin:14px auto 0;color:#dce5f7;font-size:clamp(.84rem,2.6vw,1.05rem);line-height:1.45}.choices{position:absolute;left:50%;bottom:max(5.8%,env(safe-area-inset-bottom));width:min(76%,590px);height:31%;transform:translateX(-50%);display:grid;grid-template-rows:1fr 1fr;gap:5.5%}.choice{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px clamp(20px,5vw,38px);border:1px solid rgba(255,255,255,.5);border-radius:999px;color:#fff;text-decoration:none;background:rgba(3,8,25,.28);box-shadow:inset 0 0 28px rgba(255,255,255,.04),0 12px 40px rgba(0,0,0,.28);backdrop-filter:blur(5px);transition:transform .18s,border-color .18s,background .18s}.choice:active{transform:scale(.975)}.choice:hover{transform:translateY(-3px);background:rgba(8,15,43,.54);border-color:#fff}.choice strong{display:block;font-size:clamp(1.25rem,5vw,2rem);line-height:1}.choice small{display:block;margin-top:7px;color:#d4dded;font-size:clamp(.62rem,2.1vw,.82rem);letter-spacing:.06em}.icon{display:grid;place-items:center;flex:0 0 auto;width:46px;height:46px;border-radius:50%;font-size:1.35rem;font-weight:800}.beatline{border-color:rgba(232,143,255,.85)}.beatline .icon{background:#d44fff;box-shadow:0 0 24px #9b35ff}.orten{border-color:rgba(92,221,255,.9)}.orten .icon{background:#c9ff59;color:#07100d;box-shadow:0 0 24px #57eaff}.credit{position:absolute;right:14px;bottom:10px;color:rgba(255,255,255,.42);font-size:.55rem;letter-spacing:.1em}@media(min-width:850px){.art{object-position:center 54%}.top{top:5vh}.choices{width:min(47vw,620px);height:30%;bottom:5%}}@media(max-height:700px){.top{top:max(14px,env(safe-area-inset-top))}.brand{margin-bottom:7px}.intro{margin-top:8px}.choices{height:30%;bottom:max(3%,env(safe-area-inset-bottom))}}@media(prefers-reduced-motion:reduce){.choice{transition:none}}
  </style>
</head>
<body>
  <main class="portal">
    <img class="art" src="assets/mlspel-portal.png" alt="">
    <div class="shade" aria-hidden="true"></div>
    <header class="top"><div class="brand">MLspel · Umeå</div><h1>Välj din <span>spelvärld</span></h1><p class="intro">Två helt olika upplevelser. Musik, geografi och tävling — välj ett spel och börja direkt.</p></header>
    <nav class="choices" aria-label="Välj spel">
      <a class="choice beatline" href="https://manngez.github.io/Beatline/"><span><strong>Beatline</strong><small>Placera låtarna rätt i tiden</small></span><span class="icon" aria-hidden="true">♫</span></a>
      <a class="choice orten" href="https://manngez.github.io/orten/"><span><strong>Orten</strong><small>Hitta orterna och dra linjerna</small></span><span class="icon" aria-hidden="true">⌖</span></a>
    </nav>
    <span class="credit">© 2026 MLSPEL</span>
  </main>
</body>
</html>
