<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a2b"><title>Ekonomikampen – träna inför provet</title>
<style>
:root{--navy:#071a2b;--blue:#0d6efd;--cyan:#33d6c5;--gold:#ffd166;--red:#ff5d73;--card:#102c44;--text:#f7fbff;--muted:#a9bfd0;--green:#3ee39a}
*{box-sizing:border-box}html{background:var(--navy)}body{margin:0;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 85% 5%,#154c67 0,transparent 32rem),linear-gradient(160deg,#071a2b,#06111e);min-height:100svh}
button{font:inherit}.app{max-width:760px;margin:auto;padding:18px 16px 110px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.brand{font-weight:900;letter-spacing:.04em}.brand span{color:var(--cyan)}.streak{background:#ffffff12;border:1px solid #ffffff1c;padding:8px 12px;border-radius:999px;font-weight:800}
.hero{padding:28px 0 16px}.eyebrow{color:var(--cyan);font-weight:850;text-transform:uppercase;letter-spacing:.13em;font-size:.75rem}.hero h1{font-size:clamp(2.2rem,11vw,4.6rem);line-height:.93;margin:10px 0 14px;letter-spacing:-.055em}.hero p{color:var(--muted);font-size:1.06rem;line-height:1.55;max-width:560px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stat{background:#ffffff0b;border:1px solid #ffffff14;border-radius:18px;padding:15px;text-align:center}.stat b{display:block;font-size:1.35rem}.stat small{color:var(--muted)}
.grid{display:grid;gap:12px}.card{background:linear-gradient(145deg,#12334e,#0c263c);border:1px solid #ffffff18;border-radius:24px;padding:20px;box-shadow:0 18px 60px #0004}.mode{width:100%;color:inherit;text-align:left;cursor:pointer;position:relative;overflow:hidden}.mode:active{transform:scale(.985)}.mode .icon{font-size:2rem}.mode h2{margin:10px 0 5px;font-size:1.25rem}.mode p{margin:0;color:var(--muted);line-height:1.4}.mode .go{position:absolute;right:18px;top:18px;font-size:1.3rem}.accent{border-color:#33d6c555}.exam{background:linear-gradient(140deg,#60450a,#2c260e);border-color:#ffd16666}
.progress{height:9px;background:#ffffff16;border-radius:20px;overflow:hidden;margin:12px 0 24px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));transition:width .35s}
.quizHead{display:flex;justify-content:space-between;color:var(--muted);font-weight:750}.question{font-size:clamp(1.45rem,6vw,2.15rem);line-height:1.18;margin:22px 0}.answers{display:grid;gap:11px}.answer{border:1px solid #ffffff1e;background:#ffffff0c;color:var(--text);padding:16px;border-radius:16px;text-align:left;font-weight:750;cursor:pointer;line-height:1.35}.answer:hover{border-color:var(--cyan)}.answer.correct{background:#0d573d;border-color:var(--green)}.answer.wrong{background:#612333;border-color:var(--red)}.answer:disabled{cursor:default}
.feedback{margin-top:16px;border-radius:18px;padding:17px;line-height:1.5}.feedback.good{background:#0b513a}.feedback.bad{background:#572031}.feedback b{display:block;margin-bottom:5px}.next,.primary,.secondary{border:0;border-radius:15px;padding:15px 18px;font-weight:900;cursor:pointer}.next,.primary{background:var(--cyan);color:#03221f;width:100%;margin-top:14px}.secondary{background:#ffffff13;color:var(--text);border:1px solid #ffffff20}.hidden{display:none!important}
.result{text-align:center}.result .trophy{font-size:4rem}.result h2{font-size:2.25rem;margin:8px}.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:22px auto;background:conic-gradient(var(--cyan) var(--score),#ffffff17 0)}.ring:after{content:attr(data-score);width:118px;height:118px;background:#0d263b;border-radius:50%;display:grid;place-items:center;font-size:2rem;font-weight:950}.review{text-align:left;margin-top:18px}.reviewItem{padding:13px 0;border-bottom:1px solid #ffffff17}.reviewItem b{display:block}.reviewItem span{color:var(--muted)}
.sheet{position:fixed;inset:auto 0 0;background:#0b2235;border-top:1px solid #ffffff22;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;z-index:4}.sheet button{max-width:350px}
.topic{display:inline-flex;gap:7px;align-items:center;color:var(--cyan);font-weight:850;font-size:.84rem}.tip{font-size:.88rem;color:var(--muted);margin-top:22px;text-align:center}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}.exam{grid-column:1/-1}.app{padding-top:30px}}
</style>
</head>
<body><main class="app">
<section id="home">
<div class="top"><div class="brand">EKONOMI<span>KAMPEN</span></div><div class="streak">🔥 <span id="streak">0</span> i rad</div></div>
<div class="hero"><div class="eyebrow">Samhällskunskap • provträning</div><h1>Fatta ekonomin.<br>Klara provet.</h1><p>Träna i korta rundor, få en tydlig förklaring direkt och repetera det som var svårt.</p></div>
<div class="stats"><div class="stat"><b id="mastered">0</b><small>bemästrade</small></div><div class="stat"><b id="best">0%</b><small>bästa prov</small></div><div class="stat"><b id="answered">0</b><small>svar totalt</small></div></div>
<div class="grid">
<button class="card mode accent" onclick="start('system')"><span class="icon">🏪</span><span class="go">→</span><h2>Ekonomiska system</h2><p>Marknad, plan, blandekonomi och priser.</p></button>
<button class="card mode" onclick="start('handel')"><span class="icon">🌍</span><span class="go">→</span><h2>Handel mellan länder</h2><p>Import, export, frihandel och handelshinder.</p></button>
<button class="card mode" onclick="start('kretslopp')"><span class="icon">🔄</span><span class="go">→</span><h2>Ekonomiska kretsloppet</h2><p>Hushåll, företag, offentlig sektor och banker.</p></button>
<button class="card mode" onclick="start('fel')"><span class="icon">🎯</span><span class="go">→</span><h2>Repetera svåra frågor</h2><p id="wrongCount">Inga frågor sparade ännu.</p></button>
<button class="card mode exam" onclick="start('exam')"><span class="icon">🏆</span><span class="go">→</span><h2>Slutprov</h2><p>15 blandade frågor. Målet är minst 12 rätt.</p></button>
</div><p class="tip">Dina resultat sparas automatiskt på den här enheten.</p></section>
<section id="quiz" class="hidden">
<div class="top"><button class="secondary" onclick="goHome()">← Avsluta</button><div class="streak">⭐ <span id="score">0</span> p</div></div>
<div class="quizHead"><span id="qnum"></span><span id="topic"></span></div><div class="progress"><i id="bar"></i></div>
<div class="card"><div class="topic" id="badge"></div><h2 class="question" id="question"></h2><div class="answers" id="answers"></div><div id="feedback" class="feedback hidden"></div><button id="next" class="next hidden" onclick="nextQuestion()">Nästa fråga →</button></div>
</section>
<section id="result" class="hidden result"><div class="card"><div class="trophy" id="trophy">🏆</div><h2 id="resultTitle"></h2><p id="resultText"></p><div class="ring" id="ring" data-score="0%"></div><div class="review" id="review"></div><button class="primary" onclick="retry()">Kör igen</button><button class="secondary" style="width:100%;margin-top:10px" onclick="goHome()">Till startsidan</button></div></section>
</main>
<script>
const Q=[
{id:1,c:'system',q:'Vad innebär marknadsekonomi?',a:['Staten bestämmer all produktion','Företag och konsumenter styr genom köp och försäljning','Alla får exakt samma lön','Handel med andra länder är förbjuden'],r:1,e:'I en marknadsekonomi påverkar konsumenternas efterfrågan och företagens utbud vad som produceras och till vilket pris.'},
{id:2,c:'system',q:'Vad krävs för att en marknadsekonomi ska fungera väl?',a:['Fri konkurrens och möjlighet att starta företag','Att bara ett företag säljer varje vara','Att staten bestämmer alla priser','Att ingen får göra vinst'],r:0,e:'Konkurrens och fri etablering ger konsumenterna alternativ och pressar företag att förbättra pris och kvalitet.'},
{id:3,c:'system',q:'Vad händer oftast med priset när efterfrågan ökar men utbudet är oförändrat?',a:['Priset sjunker','Priset stiger','Priset blir alltid noll','Ingenting kan påverka priset'],r:1,e:'Fler vill köpa samma begränsade mängd. Då kan säljarna normalt ta ett högre pris.'},
{id:4,c:'system',q:'Vad menas med marknadspris?',a:['Det pris staten alltid bestämmer','Priset där utbud och efterfrågan möts','Varans tillverkningskostnad','Det lägsta tillåtna priset'],r:1,e:'Marknadspriset bildas i samspelet mellan hur mycket som erbjuds och hur mycket konsumenterna vill köpa.'},
{id:5,c:'system',q:'Vad är fri konkurrens?',a:['Flera företag tävlar om kunderna på rimligt lika villkor','Ett enda företag bestämmer allt','Alla varor är gratis','Staten äger samtliga företag'],r:0,e:'Fri konkurrens innebär att flera företag kan konkurrera med exempelvis pris, kvalitet och service.'},
{id:6,c:'system',q:'Vilken är en möjlig nackdel med marknadsekonomi?',a:['Det kan uppstå stora ekonomiska skillnader','Det finns aldrig något utbud','Ingen kan välja vad den vill köpa','Alla företag ägs av staten'],r:0,e:'Marknaden kan skapa tillväxt och valfrihet men också ojämlikhet, monopol och miljöproblem om den saknar regler.'},
{id:7,c:'system',q:'Vad kännetecknar planekonomi?',a:['Konsumenterna bestämmer statsbudgeten','Staten bestämmer i stor utsträckning vad som ska produceras och priset','Alla företag tävlar helt fritt','Utbud och efterfrågan avgör alltid allt'],r:1,e:'I en planekonomi planerar staten produktion, fördelning och ofta priser.'},
{id:8,c:'system',q:'Vad är blandekonomi?',a:['En blandning av byteshandel och pengar','En marknadsekonomi med offentlig sektor och statliga regler','Två länder med samma valuta','En ekonomi utan företag'],r:1,e:'Sverige är en blandekonomi: privata marknader kombineras med skatter, regler och offentligt finansierad verksamhet.'},
{id:9,c:'system',q:'Vad är marknadskrafter?',a:['Utbud och efterfrågan som påverkar pris och produktion','Lagar som förbjuder handel','Bara riksdagens beslut','Företagens byggnader och maskiner'],r:0,e:'Marknadskrafter syftar främst på samspelet mellan utbud och efterfrågan.'},
{id:10,c:'handel',q:'Varför handlar länder med varandra?',a:['Alla länder har exakt samma resurser','Länder kan specialisera sig och få varor de saknar','För att slippa använda pengar','För att alltid höja priserna'],r:1,e:'Olika naturresurser, klimat och kunskaper gör att länder tjänar på specialisering och utbyte.'},
{id:11,c:'handel',q:'Vad är import?',a:['Varor och tjänster som säljs till andra länder','Varor och tjänster som köps från andra länder','Skatt på svenska varor','Pengar som sparas i en bank'],r:1,e:'Import är sådant ett land köper in från utlandet.'},
{id:12,c:'handel',q:'Vad är export?',a:['Varor och tjänster som säljs till andra länder','Varor som förbjuds vid gränsen','All offentlig konsumtion','Varor som bara säljs hemma'],r:0,e:'Export är varor och tjänster som företag i ett land säljer utomlands.'},
{id:13,c:'handel',q:'Vad innebär frihandel?',a:['Handel utan pengar','Handel med få eller inga tullar och andra handelshinder','Att bara staten får handla','Att varor alltid är gratis'],r:1,e:'Frihandel innebär att varor och tjänster kan röra sig över gränser med få hinder.'},
{id:14,c:'handel',q:'Vilket är ett handelshinder?',a:['Tull på importerade varor','Fri konkurrens','Specialisering','Export av tjänster'],r:0,e:'En tull är en avgift på import. Kvoter, regler och importförbud kan också vara handelshinder.'},
{id:15,c:'handel',q:'Varför kan ett land införa tullar?',a:['För att skydda inhemska företag från utländsk konkurrens','För att all import ska bli billigare','För att avskaffa gränser','För att öka frihandeln'],r:0,e:'Tullar kan skydda jobb och företag hemma, men de gör ofta importerade varor dyrare och kan minska handeln.'},
{id:16,c:'handel',q:'Vilken risk finns med stort beroende av import?',a:['Leveranser kan störas vid kris eller konflikt','Landet får automatiskt för många naturresurser','Alla priser sjunker till noll','Export blir omöjlig'],r:0,e:'Pandemier, krig och transportproblem kan göra viktiga importerade varor svåra att få tag på.'},
{id:17,c:'kretslopp',q:'Vad säljer hushållen till företagen i det ekonomiska kretsloppet?',a:['Arbetskraft','Skatter','Bidrag','Tullar'],r:0,e:'Hushållen arbetar åt företagen och får lön tillbaka.'},
{id:18,c:'kretslopp',q:'Vad får hushållen från företag i utbyte mot arbete?',a:['Tull','Lön','Moms','Ränta på lån'],r:1,e:'Företagen betalar lön. Hushållen använder sedan inkomsten till konsumtion, skatt och sparande.'},
{id:19,c:'kretslopp',q:'Varför betalar hushåll och företag skatt?',a:['För att finansiera offentlig verksamhet och välfärd','För att stoppa all konsumtion','För att banker ska få vinst','För att avskaffa pengar'],r:0,e:'Skatter finansierar bland annat skola, vård, vägar, polis och ekonomiska stöd.'},
{id:20,c:'kretslopp',q:'Vilken roll har banker i kretsloppet?',a:['De bestämmer allt som ska produceras','De tar emot sparande och lånar ut pengar','De tillverkar alla varor','De ersätter offentlig sektor'],r:1,e:'Banker förmedlar pengar mellan sparare och dem som behöver låna till konsumtion eller investeringar.'},
{id:21,c:'kretslopp',q:'Vad kan hända i kretsloppet om hushållen minskar sin konsumtion kraftigt?',a:['Företagen säljer mindre och kan behöva minska produktionen','Företagen säljer automatiskt mer','Skatterna försvinner helt','Import och export blir samma sak'],r:0,e:'Mindre konsumtion ger företag lägre intäkter. Det kan leda till lägre produktion och färre anställda.'},
{id:22,c:'kretslopp',q:'Vad är transfereringar?',a:['Pengar som offentlig sektor betalar ut, exempelvis barnbidrag','Varor som exporteras','Bankernas lokaler','Företagens reklam'],r:0,e:'Bidrag, pensioner och sjukpenning är exempel på transfereringar från offentlig sektor till hushåll.'},
{id:23,c:'kretslopp',q:'Vad är en investering för ett företag?',a:['Köp som ska öka framtida produktion, till exempel en maskin','Lön som betalas till en kund','En privat semesterresa','En tull på export'],r:0,e:'Investeringar är satsningar på exempelvis maskiner, lokaler eller teknik som kan öka företagets framtida kapacitet.'},
{id:24,c:'kretslopp',q:'Vilka är fyra centrala delar i det ekonomiska kretsloppet?',a:['Hushåll, företag, offentlig sektor och banker','Skolor, väder, sport och medier','Import, klimat, språk och lagar','Bara hushåll och företag'],r:0,e:'Pengar, arbete, varor och tjänster rör sig mellan hushåll, företag, offentlig sektor och finanssektor.'}
];
const names={system:'Ekonomiska system',handel:'Handel',kretslopp:'Kretslopp',fel:'Repetition',exam:'Slutprov'};
let state={list:[],i:0,score:0,answers:[],mode:'',locked:false};
let saved=JSON.parse(localStorage.getItem('ekonomikampen')||'{"answered":0,"best":0,"wrong":[],"correctIds":[]}');
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function updateHome(){document.querySelector('#answered').textContent=saved.answered;document.querySelector('#best').textContent=saved.best+'%';document.querySelector('#mastered').textContent=new Set(saved.correctIds).size;document.querySelector('#wrongCount').textContent=saved.wrong.length?saved.wrong.length+' frågor väntar på repetition.':'Inga frågor sparade ännu.';document.querySelector('#streak').textContent=localStorage.getItem('ekostreak')||0}
function start(mode){state={list:[],i:0,score:0,answers:[],mode,locked:false};if(mode==='exam')state.list=shuffle(Q).slice(0,15);else if(mode==='fel'){state.list=shuffle(Q.filter(x=>saved.wrong.includes(x.id)));if(!state.list.length){alert('Snyggt! Du har inga fel att repetera ännu.');return}}else state.list=shuffle(Q.filter(x=>x.c===mode));show('quiz');render()}
function show(id){['home','quiz','result'].forEach(x=>document.querySelector('#'+x).classList.toggle('hidden',x!==id));scrollTo(0,0)}
function render(){state.locked=false;let q=state.list[state.i];document.querySelector('#score').textContent=state.score;document.querySelector('#qnum').textContent='Fråga '+(state.i+1)+' av '+state.list.length;document.querySelector('#topic').textContent=names[state.mode];document.querySelector('#bar').style.width=(state.i/state.list.length*100)+'%';document.querySelector('#badge').textContent=({system:'🏪 EKONOMISKA SYSTEM',handel:'🌍 HANDEL',kretslopp:'🔄 KRETSLOPP'})[q.c];document.querySelector('#question').textContent=q.q;let box=document.querySelector('#answers');box.innerHTML='';q.a.forEach((a,n)=>{let b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+n)+'.  '+a;b.onclick=()=>answer(n,b);box.appendChild(b)});document.querySelector('#feedback').className='feedback hidden';document.querySelector('#next').classList.add('hidden')}
function answer(n,b){if(state.locked)return;state.locked=true;let q=state.list[state.i],ok=n===q.r;saved.answered++;document.querySelectorAll('.answer').forEach((x,k)=>{x.disabled=true;if(k===q.r)x.classList.add('correct')});let f=document.querySelector('#feedback');if(ok){state.score++;b.classList.add('correct');f.className='feedback good';f.innerHTML='<b>✓ Rätt!</b>'+q.e;saved.wrong=saved.wrong.filter(id=>id!==q.id);saved.correctIds.push(q.id);localStorage.setItem('ekostreak',+(localStorage.getItem('ekostreak')||0)+1)}else{b.classList.add('wrong');f.className='feedback bad';f.innerHTML='<b>Inte riktigt – rätt svar är '+String.fromCharCode(65+q.r)+'.</b>'+q.e;if(!saved.wrong.includes(q.id))saved.wrong.push(q.id);localStorage.setItem('ekostreak',0)}state.answers.push({q,ok});localStorage.setItem('ekonomikampen',JSON.stringify(saved));document.querySelector('#score').textContent=state.score;let nx=document.querySelector('#next');nx.textContent=state.i===state.list.length-1?'Se resultatet →':'Nästa fråga →';nx.classList.remove('hidden')}
function nextQuestion(){state.i++;if(state.i>=state.list.length)finish();else render()}
function finish(){let pct=Math.round(state.score/state.list.length*100);if(state.mode==='exam'&&pct>saved.best){saved.best=pct;localStorage.setItem('ekonomikampen',JSON.stringify(saved))}show('result');document.querySelector('#trophy').textContent=pct>=80?'🏆':pct>=60?'💪':'📚';document.querySelector('#resultTitle').textContent=pct>=80?'Provet sitter!':pct>=60?'Bra jobbat!':'Ett varv till';document.querySelector('#resultText').textContent=state.score+' av '+state.list.length+' rätt. '+(pct>=80?'Du nådde målet – fortsätt hålla kunskapen varm.':pct>=60?'Nära målet. Repetera frågorna nedan.':'Läs förklaringarna och försök igen – du lär dig för varje runda.');let ring=document.querySelector('#ring');ring.dataset.score=pct+'%';ring.style.setProperty('--score',pct+'%');let wrong=state.answers.filter(x=>!x.ok);document.querySelector('#review').innerHTML=wrong.length?'<h3>Det här bör du repetera</h3>'+wrong.map(x=>'<div class="reviewItem"><b>'+x.q.q+'</b><span>'+x.q.e+'</span></div>').join(''):'<h3>Alla rätt – strålande!</h3>'}
function retry(){start(state.mode)}function goHome(){show('home');updateHome()}updateHome();
</script></body></html>
